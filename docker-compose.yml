# ─────────────────────────────────────────────────────────
# SAHYOG Portal — Standalone
# http://<host>:8085
# ─────────────────────────────────────────────────────────

services:
  sahyog-app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sahyog-app
    env_file: backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - sahyog_net
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 128M

  sahyog-nginx:
    image: nginx:1.27-alpine
    container_name: sahyog-nginx
    ports:
      - "8085:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      sahyog-app:
        condition: service_healthy
    networks:
      - sahyog_net
    restart: unless-stopped

networks:
  sahyog_net:
    driver: bridge
    name: sahyog-network
